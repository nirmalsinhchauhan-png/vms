user  nginx;
worker_processes  auto;
pid /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    log_format vms_main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" '
                        'urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log vms_main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;
    client_max_body_size 25m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml application/vnd.apple.mpegurl;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ------------------------------------------------------------------
    # Rate limiting: protect auth endpoints from brute force / credential
    # stuffing and cap general API abuse.
    # ------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=auth_zone:10m   rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api_zone:10m    rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;

    upstream backend_api {
        server backend:8080;
        keepalive 32;
    }

    upstream go2rtc_live {
        server go2rtc:1984;
        keepalive 32;
    }

    upstream frontend_app {
        server frontend:3000;
    }

    # ------------------------------------------------------------------
    # HTTP -> HTTPS redirect
    # ------------------------------------------------------------------
    server {
        listen 80 default_server;
        server_name _;

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        client_max_body_size 25m;
        limit_conn conn_zone 20;

        # --------------------------------------------------------------
        # Auth endpoints — tighter rate limit against brute force.
        # --------------------------------------------------------------
        location /api/v1/auth/ {
            limit_req zone=auth_zone burst=10 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --------------------------------------------------------------
        # General REST API (Go + Fiber backend)
        # --------------------------------------------------------------
        location /api/ {
            limit_req zone=api_zone burst=100 nodelay;

            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # --------------------------------------------------------------
        # Backend WebSocket (live event/notification stream)
        # --------------------------------------------------------------
        location /api/ws/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        # --------------------------------------------------------------
        # Live streaming (go2rtc — substream, HLS/WebRTC/MSE/WS signaling)
        # Sub-3s latency path; do not route this through FFmpeg.
        # --------------------------------------------------------------
        location /live/ {
            proxy_pass http://go2rtc_live/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_buffering off;
            proxy_read_timeout 3600s;
        }

        # --------------------------------------------------------------
        # Recorded HLS segments (FFmpeg mainstream output on XFS).
        # Every request is authorized against the backend, which validates
        # the HMAC-SHA256 signed segment token before nginx serves the file.
        # --------------------------------------------------------------
        location /recordings/ {
            auth_request /internal/hls-auth;

            alias /data/recordings/;
            add_header Cache-Control "private, max-age=30";

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }

        location = /internal/hls-auth {
            internal;
            proxy_pass http://backend_api/internal/v1/hls/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # --------------------------------------------------------------
        # Frontend (React + Vite)
        # --------------------------------------------------------------
        location / {
            proxy_pass http://frontend_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            access_log off;
            return 200 "ok\n";
        }
    }
}
