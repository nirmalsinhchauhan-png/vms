name: vms-platform

networks:
  vms-net:
    name: vms-net
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  go2rtc_config:
  recordings:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${RECORDING_STORAGE_PATH:-./data/recordings}

secrets:
  jwt_private_key:
    file: ./secrets/jwt_private.pem
  jwt_public_key:
    file: ./secrets/jwt_public.pem
  license_public_key:
    file: ./secrets/license_public.pem

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # Schema is applied explicitly via `make migrate-up` (golang-migrate),
    # not docker-entrypoint-initdb.d — running both would double-apply and
    # fight over schema_migrations bookkeeping.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - vms-net
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - vms-net
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  go2rtc:
    image: alexxit/go2rtc:1.9.4
    restart: unless-stopped
    volumes:
      - go2rtc_config:/config
      - ./go2rtc/go2rtc.yaml:/config/go2rtc.yaml:ro
    networks:
      - vms-net
    ports:
      - "${GO2RTC_API_PORT:-1984}:1984"
      - "${GO2RTC_RTSP_PORT:-8554}:8554"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/tcp"
      - "${GO2RTC_WEBRTC_PORT:-8555}:8555/udp"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:1984/api"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_HOST: redis
      GO2RTC_HOST: go2rtc
    secrets:
      - jwt_private_key
      - jwt_public_key
      - license_public_key
    volumes:
      - recordings:${RECORDING_STORAGE_PATH:-/data/recordings}
    networks:
      - vms-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      go2rtc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_HLS_BASE_URL: ${VITE_HLS_BASE_URL}
    restart: unless-stopped
    networks:
      - vms-net

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/tls:/etc/nginx/tls:ro
    networks:
      - vms-net
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - backend
      - go2rtc
      - frontend
