# ==============================================================================
# go2rtc — live view pipeline (substream only; sub-3s latency, zero-copy).
#
# Camera streams are NOT declared statically here. The backend registers and
# removes them at runtime via go2rtc's own HTTP API (PUT/DELETE /api/streams)
# whenever a camera is added, edited, or removed — this file only configures
# the engine itself. Recording (mainstream, FFmpeg, 10s HLS segments on XFS)
# is a fully separate pipeline the backend drives directly; it never goes
# through go2rtc.
#
# This is a template, not the live config: `make init` copies it to
# go2rtc.yaml (gitignored), which go2rtc then rewrites in place as cameras
# are added — the same .example -> real-file pattern as .env.example/.env.
# Don't edit go2rtc.yaml expecting it to stay as you left it, and don't
# hand-edit this template to add streams; the backend owns that at runtime.
# ==============================================================================

log:
  level: info
  format: text

api:
  listen: ":1984"
  # Nginx (see nginx/nginx.conf, location /live/) is the only intended public
  # entry point; go2rtc's own API has no auth of its own, so it must never be
  # exposed outside the compose network.
  origin: "*"

rtsp:
  listen: ":8554"
  # Only the backend/go2rtc-to-camera path uses RTSP; nothing external
  # connects to this port directly.
  username: ""
  password: ""

webrtc:
  listen: ":8555/tcp"
  candidates:
    - stun:8555

# Deliberately a bare key, not `streams: {}` — go2rtc 1.9.4 has a real
# config-patching bug where PUT /api/streams fails with a YAML parse error
# ("did not find expected key") if the existing streams key is the flow-
# style empty map `{}`; a bare/null key round-trips through its internal
# patch-and-reparse logic correctly. Confirmed by isolating both forms
# against a throwaway container — not a guess.
streams:
